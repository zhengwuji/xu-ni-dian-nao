# 每次推送到 main / 手动触发：自动编译 APK 并发布到 Releases
#
# 流程：
#   1. 校验并准备构建输入（jniLibs / patch.tar.gz / rootfs 分片）
#      - 优先用仓库里已提交的 assets/xa*；没有就从 Release 资产下载 debian-<桌面>.tar.xz 再分割
#   2. flutter analyze + flutter test（失败不阻断构建，见 continue-on-error 注释）
#   3. 编译 arm64 release APK（有签名 Secrets 就签，没有就用 debug key 并标注）
#   4. 计算 SHA-256、生成更新日志（读 CHANGELOG.md，没有就取 commit 记录）
#   5. 创建/更新 GitHub Release 并上传 APK

name: Build & Release APK

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'doc/**'
      - 'readme/**'
      - '.github/ISSUE_TEMPLATE/**'
  workflow_dispatch:
    inputs:
      desktop:
        description: '桌面环境'
        required: true
        default: 'xfce'
        type: choice
        options: [ xfce, lxqt, gxde ]
      tag:
        description: '发布 tag（留空则自动生成 v<版本>-<构建号>）'
        required: false
        default: ''
      prerelease:
        description: '标记为预发布'
        required: false
        default: false
        type: boolean

# 同一分支的构建串行执行，避免两个 Release 同时写同一个 tag
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  DESKTOP: ${{ github.event.inputs.desktop || 'xfce' }}
  # 上游 v1.1.0 的 release 里放着 rootfs / jniLibs / patch.tar.gz
  UPSTREAM_TAG: v1.1.0
  UPSTREAM_REPO: Cateners/tiny_container

jobs:
  build:
    name: Build ${{ github.event.inputs.desktop || 'xfce' }} APK
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0          # 生成更新日志需要历史
          submodules: false

      - name: 环境信息
        run: |
          echo "repo      = $GITHUB_REPOSITORY"
          echo "ref       = $GITHUB_REF"
          echo "sha       = $GITHUB_SHA"
          echo "desktop   = $DESKTOP"
          uname -a
          df -h /

      - name: 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          # pubspec.lock 要求 flutter >=3.38.4；用 3.38.x 保证可复现
          flutter-version: '3.38.x'
          cache: true

      - name: 安装 JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: 记录 Flutter / Dart 版本
        run: |
          flutter --version
          dart --version

      - name: 缓存上游构建原料 (rootfs / jniLibs / patch)
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/tc-inputs
          key: tc-inputs-${{ env.UPSTREAM_REPO }}-${{ env.UPSTREAM_TAG }}-${{ env.DESKTOP }}

      - name: 准备构建输入
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          bash .github/scripts/prepare-inputs.sh

      - name: 生成签名文件
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "::warning::未配置 KEYSTORE_BASE64，本次使用 debug 签名；debug 签名的包无法覆盖安装正式版。"
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          umask 077
          mkdir -p keys
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > keys/release.jks
          # 校验密钥可读，密码错时在这里就失败，而不是等到编译结束
          keytool -list -keystore keys/release.jks -storepass "$KEYSTORE_PASSWORD" -alias "${KEY_ALIAS:-upload}" >/dev/null

          # ⚠️ storeFile 用绝对路径。
          # build.gradle 里的 file(...) 是相对 android/app/ 解析的，
          # 写相对路径很容易指错（例如 ../keys/release.jks 会解析到 android/keys/release.jks）。
          KS_ABS="$(pwd)/keys/release.jks"
          cat > android/keystore.properties <<EOF
          storePassword=${KEYSTORE_PASSWORD}
          keyPassword=${KEY_PASSWORD:-$KEYSTORE_PASSWORD}
          keyAlias=${KEY_ALIAS:-upload}
          storeFile=${KS_ABS}
          EOF

          echo "keystore 路径：${KS_ABS}"
          ls -l "$KS_ABS"
          # 把 Gradle 关心的东西写成环境变量，编译后用它判断签名是否真的生效
          echo "keystore_abs=${KS_ABS}" >> "$GITHUB_OUTPUT"
          echo "signed=true" >> "$GITHUB_OUTPUT"
          echo "已配置发布签名（alias=${KEY_ALIAS:-upload}），密钥内容不会打印"

      - name: flutter pub get
        run: flutter pub get

      - name: 静态检查（不阻断发布）
        continue-on-error: true
        run: flutter analyze --no-fatal-infos || true

      - name: 单元测试（不阻断发布）
        continue-on-error: true
        run: flutter test

      - name: 计算版本号
        id: ver
        run: |
          set -euo pipefail
          VERSION=$(grep -E '^version:' pubspec.yaml | head -1 | sed -E 's/^version:[[:space:]]*//' | tr -d '\r')
          NAME="${VERSION%%+*}"           # 1.1.1+20260920 -> 1.1.1
          PUBSPEC_BUILD="${VERSION##*+}"  # 1.1.1+20260920 -> 20260920

          # versionCode 必须严格递增，否则系统/安装器可能拒绝覆盖安装。
          # 用「固定基数 + 工作流运行号」保证单调：基数取 30000000，
          # 高于历史上任何一个用 pubspec 构建号（2026xxxx）发布过的版本，
          # 又远低于 Android 上限 2100000000。
          VERSION_CODE=$((30000000 + GITHUB_RUN_NUMBER))

          echo "version_name=$NAME"            >> "$GITHUB_OUTPUT"
          echo "pubspec_build=$PUBSPEC_BUILD"  >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE"    >> "$GITHUB_OUTPUT"
          echo "版本名      : $NAME"
          echo "pubspec构建号: $PUBSPEC_BUILD"
          echo "versionCode : $VERSION_CODE  (= 30000000 + 运行号 $GITHUB_RUN_NUMBER)"

      - name: 编译 APK
        env:
          CURRENT_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          # --build-number 让 Flutter 把 versionCode 写成我们算好的递增值
          # （它会落到 local.properties 的 flutter.versionCode，Gradle 直接读取）
          flutter build apk \
            --release \
            --build-name="${{ steps.ver.outputs.version_name }}" \
            --build-number="${{ steps.ver.outputs.version_code }}" \
            --target-platform android-arm64 \
            --split-per-abi 2>&1 | tee /tmp/flutter-build.log

          # 把 Gradle 关于签名的判断捞出来（配置阶段的日志默认不显示，
          # 这里显式确认到底用了哪套签名配置）
          echo "--- Gradle 签名相关输出 ---"
          grep -aE '使用发布签名|未找到有效的发布签名' /tmp/flutter-build.log || echo "(未捕获到签名日志)"

      - name: 收集产物并计算校验和
        id: collect
        run: |
          set -euo pipefail
          mkdir -p artifacts
          # 版本信息统一来自「计算版本号」步骤，不在这里重复推导，避免两边不一致
          NAME="${{ steps.ver.outputs.version_name }}"
          BUILD="${{ steps.ver.outputs.version_code }}"
          APK_SRC="build/app/outputs/flutter-apk/app-arm64-v8a-release.apk"
          APK_NAME="tiny-computer-${DESKTOP}-${NAME}.apk"
          cp "$APK_SRC" "artifacts/$APK_NAME"
          # 校验和
          ( cd artifacts && sha256sum "$APK_NAME" > SHA256SUMS )
          # 顺手保留兼容旧习惯的单文件 sha
          ( cd artifacts && sha256sum "$APK_NAME" > "$APK_NAME.sha256" )
          {
            echo "version=$NAME"
            echo "build_number=$BUILD"
            echo "apk_name=$APK_NAME"
            echo "apk_path=artifacts/$APK_NAME"
            echo "sha256=$(sha256sum "artifacts/$APK_NAME" | cut -d' ' -f1)"
            echo "size_mb=$(( $(stat -c%s "artifacts/$APK_NAME") / 1048576 ))"
          } >> "$GITHUB_OUTPUT"
          echo "产物：" ; ls -lh artifacts

      - name: 安装 Android 命令行工具（校验 APK 需要 apksigner / aapt2）
        uses: android-actions/setup-android@v3
        with:
          packages: 'build-tools;34.0.0 platform-tools'
          log-accepted-android-sdk-licenses: false

      - name: 校验 APK 签名 / 包名 / versionCode（保证可覆盖安装）
        id: verify
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 配置了 keystore 就必须打出正式签名，否则脚本直接失败
          EXPECT_SIGNED: ${{ steps.signing.outputs.signed }}
          # 与历史版本比较时，要求 versionCode 严格递增（保证覆盖安装可靠）
          REQUIRE_VERSION_CODE_BUMP: 'true'
        run: |
          set -euo pipefail
          # 对比基准：本仓库上一个 Release 里的同桌面 APK
          OLD_APK=""
          if command -v gh >/dev/null 2>&1; then
            OLD_TAG=$(gh release list -R "$GITHUB_REPOSITORY" -L 20 --json tagName -q '.[].tagName' 2>/dev/null | head -1 || true)
            if [ -n "$OLD_TAG" ]; then
              mkdir -p /tmp/old-apk
              gh release download "$OLD_TAG" -R "$GITHUB_REPOSITORY" \
                -p "*${DESKTOP}*.apk" -D /tmp/old-apk --clobber 2>/dev/null || true
              OLD_APK=$(ls /tmp/old-apk/*.apk 2>/dev/null | head -1 || true)
              echo "上一版：$OLD_TAG -> ${OLD_APK:-未取到（首次发布属正常）}"
            fi
          fi

          if [ -n "$OLD_APK" ]; then
            bash .github/scripts/verify-apk.sh "${{ steps.collect.outputs.apk_path }}" "$OLD_APK"
          else
            bash .github/scripts/verify-apk.sh "${{ steps.collect.outputs.apk_path }}"
            echo "（首次发布，没有可对比的上一版；已校验本包签名与包名）"
          fi

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ env.DESKTOP }}-${{ steps.collect.outputs.version }}
          path: artifacts/*
          retention-days: 30

      - name: 生成更新日志
        id: changelog
        env:
          SIGNED: ${{ steps.signing.outputs.signed }}
        run: |
          set -euo pipefail
          bash .github/scripts/gen-changelog.sh > release-body.md
          echo "--- 生成内容预览 ---"
          head -40 release-body.md

      - name: 创建 / 更新 Release
        uses: softprops/action-gh-release@v2
        with:
          # 自动 tag：v<版本>-<短 SHA>，同一提交重复跑只会更新同一个 Release
          tag_name: ${{ github.event.inputs.tag || format('v{0}-{1}', steps.collect.outputs.version, github.sha) }}
          name: ${{ format('小小电脑 {0} ({1})', steps.collect.outputs.version, env.DESKTOP) }}
          body_path: release-body.md
          prerelease: ${{ github.event.inputs.prerelease == 'true' }}
          draft: false
          files: artifacts/*
          fail_on_unmatched_files: true

      - name: 发布结果
        run: |
          echo "### ✅ 发布完成" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- 版本：\`${{ steps.collect.outputs.version }}\`（构建号 ${{ steps.collect.outputs.build_number }}）" >> "$GITHUB_STEP_SUMMARY"
          echo "- 桌面：\`${{ env.DESKTOP }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- APK：\`${{ steps.collect.outputs.apk_name }}\`（${{ steps.collect.outputs.size_mb }} MB）" >> "$GITHUB_STEP_SUMMARY"
          echo "- SHA-256：\`${{ steps.collect.outputs.sha256 }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- 签名：${{ steps.signing.outputs.signed == 'true' && '正式签名' || '**debug 签名（未配置 KEYSTORE_BASE64）**' }}" >> "$GITHUB_STEP_SUMMARY"
