# 每次推送到 main / 手动触发：自动编译 APK 并发布到 Releases
#
# 流程：
#   1. 校验并准备构建输入（jniLibs / patch.tar.gz / rootfs 分片）
#      - 优先用仓库里已提交的 assets/xa*；没有就从 Release 资产下载 debian-<桌面>.tar.xz 再分割
#   2. flutter analyze + flutter test（失败不阻断构建，见 continue-on-error 注释）
#   3. 编译 arm64 release APK（有签名 Secrets 就签，没有就用 debug key 并标注）
#   4. 计算 SHA-256、生成更新日志（读 CHANGELOG.md，没有就取 commit 记录）
#   5. 创建/更新 GitHub Release 并上传 APK

name: Build & Release APK

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'doc/**'
      - 'readme/**'
      - '.github/ISSUE_TEMPLATE/**'
  workflow_dispatch:
    inputs:
      desktop:
        description: '桌面环境'
        required: true
        default: 'xfce'
        type: choice
        options: [ xfce, lxqt, gxde ]
      tag:
        description: '发布 tag（留空则自动生成 v<版本>-<构建号>）'
        required: false
        default: ''
      prerelease:
        description: '标记为预发布'
        required: false
        default: false
        type: boolean

# 同一分支的构建串行执行，避免两个 Release 同时写同一个 tag
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  DESKTOP: ${{ github.event.inputs.desktop || 'xfce' }}
  # 上游 v1.1.0 的 release 里放着 rootfs / jniLibs / patch.tar.gz
  UPSTREAM_TAG: v1.1.0
  UPSTREAM_REPO: Cateners/tiny_container

jobs:
  build:
    name: Build ${{ github.event.inputs.desktop || 'xfce' }} APK
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0          # 生成更新日志需要历史
          submodules: false

      - name: 环境信息
        run: |
          echo "repo      = $GITHUB_REPOSITORY"
          echo "ref       = $GITHUB_REF"
          echo "sha       = $GITHUB_SHA"
          echo "desktop   = $DESKTOP"
          uname -a
          df -h /

      - name: 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          # pubspec.lock 要求 flutter >=3.38.4；用 3.38.x 保证可复现
          flutter-version: '3.38.x'
          cache: true

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 记录 Flutter / Dart 版本
        run: |
          flutter --version
          dart --version

      - name: 准备构建输入
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          bash .github/scripts/prepare-inputs.sh

      - name: 生成签名文件
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "::warning::未配置 KEYSTORE_BASE64，本次使用 debug 签名；debug 签名的包无法覆盖安装正式版。"
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          umask 077
          mkdir -p keys
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > keys/release.jks
          # 校验密钥可读，密码错时在这里就失败，而不是等到编译结束
          keytool -list -keystore keys/release.jks -storepass "$KEYSTORE_PASSWORD" -alias "${KEY_ALIAS:-upload}" >/dev/null
          # 注意：storeFile 相对 android/app 目录，因此用 ../keys/release.jks
          cat > android/keystore.properties <<EOF
          storePassword=${KEYSTORE_PASSWORD}
          keyPassword=${KEY_PASSWORD:-$KEYSTORE_PASSWORD}
          keyAlias=${KEY_ALIAS:-upload}
          storeFile=../keys/release.jks
          EOF
          echo "signed=true" >> "$GITHUB_OUTPUT"
          echo "已配置发布签名（alias=${KEY_ALIAS:-upload}），密钥内容不会打印"

      - name: flutter pub get
        run: flutter pub get

      - name: 静态检查（不阻断发布）
        continue-on-error: true
        run: flutter analyze

      - name: 单元测试（不阻断发布）
        continue-on-error: true
        run: flutter test

      - name: 编译 APK
        env:
          CURRENT_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          # --split-debug-info 每套桌面环境独立目录，避免符号表互相覆盖
          flutter build apk \
            --release \
            --target-platform android-arm64 \
            --split-per-abi \
            --obfuscate \
            --split-debug-info="build/symbols/$DESKTOP"

      - name: 收集产物并计算校验和
        id: collect
        run: |
          set -euo pipefail
          mkdir -p artifacts
          VERSION=$(grep -E '^version:' pubspec.yaml | head -1 | sed -E 's/^version:[[:space:]]*//' | tr -d '\r')
          NAME="${VERSION%%+*}"          # 1.1.0+20260205 -> 1.1.0
          BUILD="${VERSION##*+}"         # 20260205
          APK_SRC="build/app/outputs/flutter-apk/app-arm64-v8a-release.apk"
          APK_NAME="tiny-computer-${DESKTOP}-${NAME}.apk"
          cp "$APK_SRC" "artifacts/$APK_NAME"
          # 符号表一起归档，方便对混淆后的线上崩溃做符号化
          SYMBOLS_NAME="symbols-${DESKTOP}-${NAME}.tar.gz"
          tar -czf "artifacts/$SYMBOLS_NAME" -C build/symbols "$DESKTOP"
          # 校验和
          ( cd artifacts && sha256sum "$APK_NAME" "$SYMBOLS_NAME" > SHA256SUMS )
          # 顺手保留兼容旧习惯的单文件 sha
          ( cd artifacts && sha256sum "$APK_NAME" > "$APK_NAME.sha256" )
          {
            echo "version=$NAME"
            echo "build_number=$BUILD"
            echo "apk_name=$APK_NAME"
            echo "apk_path=artifacts/$APK_NAME"
            echo "symbols_name=$SYMBOLS_NAME"
            echo "sha256=$(sha256sum "artifacts/$APK_NAME" | cut -d' ' -f1)"
            echo "size_mb=$(( $(stat -c%s "artifacts/$APK_NAME") / 1048576 ))"
          } >> "$GITHUB_OUTPUT"
          echo "产物：" ; ls -lh artifacts

      - name: 校验 APK 签名 / 包名 / versionCode（保证可覆盖安装）
        id: verify
        run: |
          set -euo pipefail
          # CI 上 make 一份“上一版”用于对比：优先取本仓库最新 Release 里的同桌面 APK，
          # 取不到就只打印本包信息（不阻断），但签名一致性仍会与预期指纹对比。
          OLD_APK=""
          if command -v gh >/dev/null 2>&1; then
            OLD_TAG=$(gh release list -R "$GITHUB_REPOSITORY" -L 20 --json tagName -q '.[].tagName' 2>/dev/null | head -1 || true)
            if [ -n "$OLD_TAG" ]; then
              mkdir -p /tmp/old-apk
              gh release download "$OLD_TAG" -R "$GITHUB_REPOSITORY" \
                -p "*${DESKTOP}*.apk" -D /tmp/old-apk --clobber 2>/dev/null || true
              OLD_APK=$(ls /tmp/old-apk/*.apk 2>/dev/null | head -1 || true)
              echo "上一版：$OLD_TAG -> ${OLD_APK:-未取到}"
            fi
          fi

          export ANDROID_HOME="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          if [ -n "$OLD_APK" ]; then
            bash .github/scripts/verify-apk.sh "${{ steps.collect.outputs.apk_path }}" "$OLD_APK"
          else
            bash .github/scripts/verify-apk.sh "${{ steps.collect.outputs.apk_path }}"
            echo "（本次没有可对比的上一版，仅校验了本包签名）"
          fi

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ env.DESKTOP }}-${{ steps.collect.outputs.version }}
          path: artifacts/*
          retention-days: 30

      - name: 生成更新日志
        id: changelog
        env:
          SIGNED: ${{ steps.signing.outputs.signed }}
        run: |
          set -euo pipefail
          bash .github/scripts/gen-changelog.sh > release-body.md
          echo "--- 生成内容预览 ---"
          head -40 release-body.md

      - name: 创建 / 更新 Release
        uses: softprops/action-gh-release@v2
        with:
          # 自动 tag：v<版本>-<短 SHA>，同一提交重复跑只会更新同一个 Release
          tag_name: ${{ github.event.inputs.tag || format('v{0}-{1}', steps.collect.outputs.version, github.sha) }}
          name: ${{ format('小小电脑 {0} ({1})', steps.collect.outputs.version, env.DESKTOP) }}
          body_path: release-body.md
          prerelease: ${{ github.event.inputs.prerelease == 'true' }}
          draft: false
          files: artifacts/*
          fail_on_unmatched_files: true

      - name: 发布结果
        run: |
          echo "### ✅ 发布完成" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- 版本：\`${{ steps.collect.outputs.version }}\`（构建号 ${{ steps.collect.outputs.build_number }}）" >> "$GITHUB_STEP_SUMMARY"
          echo "- 桌面：\`${{ env.DESKTOP }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- APK：\`${{ steps.collect.outputs.apk_name }}\`（${{ steps.collect.outputs.size_mb }} MB）" >> "$GITHUB_STEP_SUMMARY"
          echo "- SHA-256：\`${{ steps.collect.outputs.sha256 }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- 签名：${{ steps.signing.outputs.signed == 'true' && '正式签名' || '**debug 签名（未配置 KEYSTORE_BASE64）**' }}" >> "$GITHUB_STEP_SUMMARY"
